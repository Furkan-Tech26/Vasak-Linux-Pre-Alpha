name: Build ISO

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "ISO profile to build"
        required: true
        default: "vasak"
        type: choice
        options:
          - base
          - tty
          - xfce
          - vasak
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Keyed on profile as well as ref: otherwise a second profile dispatched on the
# same branch would cancel the first build instead of running beside it.
concurrency:
  group: build-iso-${{ github.ref }}-${{ github.event.inputs.profile || 'vasak' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ github.event.inputs.profile || 'vasak' }} ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROFILE: ${{ github.event.inputs.profile || 'vasak' }}
      VASAK_REPO_DIR: /work/vasak-repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight checks
        run: |
          set -euo pipefail

          echo "== Installer copies must stay identical =="
          diff -u installer/vasak-install packages/core/vasak-installer/vasak-install

          echo "== Mirrorlist copies must stay identical =="
          diff -u packages/core/vasak-mirrorlist/mirrorlist \
                  iso-profiles/base/airootfs/etc/pacman.d/mirrorlist

          echo "== Shell syntax =="
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find . -type f \( -name '*.sh' -o -name 'PKGBUILD' -o -name 'vpm' \
                    -o -name 'vasak-install' -o -name 'vasak-session' \
                    -o -name '*.install' \) -not -path './.git/*' -print0)

          echo "== Live boot configs =="
          test -f iso-profiles/base/efiboot/loader/loader.conf
          compgen -G "iso-profiles/base/efiboot/loader/entries/*.conf" >/dev/null
          grep -q 'archisobasedir=%INSTALL_DIR%' iso-profiles/base/efiboot/loader/entries/*.conf
          grep -q 'archisobasedir=%INSTALL_DIR%' iso-profiles/base/syslinux/syslinux.cfg

          echo "== SVG well-formedness =="
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          bad = []
          for p in pathlib.Path("packages").rglob("*.svg"):
              try:
                  ET.parse(p)
              except Exception as exc:
                  bad.append(f"{p}: {exc}")
          if bad:
              raise SystemExit("\n".join(bad))
          print("all SVGs parse")
          PY

          echo "== Python syntax =="
          python3 - <<'PY'
          import ast
          import pathlib
          bad = []
          count = 0
          for p in pathlib.Path("packages").rglob("*.py"):
              count += 1
              try:
                  ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
              except Exception as exc:
                  bad.append(f"{p}: {exc}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"{count} Python files parse")
          PY

          echo "== labwc configuration =="
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          rc_path = "packages/desktop/vasak-session/labwc/rc.xml"
          menu_path = "packages/desktop/vasak-session/labwc/menu.xml"

          for path, expected in ((rc_path, "labwc_config"),
                                 (menu_path, "openbox_menu")):
              root = ET.parse(path).getroot()
              if root.tag != expected:
                  raise SystemExit(f"{path}: expected <{expected}>, got <{root.tag}>")
              print(f"{path}: <{root.tag}>")

          rc = ET.parse(rc_path).getroot()
          binds = rc.findall(".//keyboard/keybind")
          by_key = {b.get("key"): b for b in binds}
          for key in ("Super_L", "W-space"):
              if key not in by_key:
                  raise SystemExit(f"rc.xml: missing {key} start-menu keybind")
          if by_key["Super_L"].get("onRelease") != "yes":
              raise SystemExit("rc.xml: Super_L must use onRelease=yes")
          action = ET.tostring(by_key["Super_L"], encoding="unicode")
          if "vasak-shell --toggle" not in action:
              raise SystemExit("rc.xml: Super_L does not toggle the Vaşak menu")
          print("rc.xml: Super_L / W-space start-menu keybinds OK")

          pkgbuild = open("packages/desktop/vasak-session/PKGBUILD",
                          encoding="utf-8").read()
          session = open("packages/desktop/vasak-session/vasak-session",
                         encoding="utf-8").read()
          if "labwc/menu.xml" not in pkgbuild:
              raise SystemExit("vasak-session PKGBUILD does not install menu.xml")
          if "/etc/xdg/vasak/labwc/menu.xml" not in session:
              raise SystemExit("vasak-session does not seed menu.xml")
          print("labwc menu.xml packaging OK")
          PY

          echo "== Live boot wiring =="
          python3 - <<'PY'
          import pathlib
          import stat

          base = pathlib.Path("iso-profiles/base/airootfs")
          autologin = base / "etc/systemd/system/getty@tty1.service.d/autologin.conf"
          profile = base / "root/.bash_profile"
          session = pathlib.Path("packages/desktop/vasak-session/vasak-session")

          text = autologin.read_text(encoding="utf-8")
          if "--autologin root" not in text:
              raise SystemExit(f"{autologin}: tty1 must auto-login root")
          if "ExecStart=\n" not in text:
              raise SystemExit(f"{autologin}: must reset the inherited ExecStart")

          text = profile.read_text(encoding="utf-8")
          if "vasak-session" not in text:
              raise SystemExit(f"{profile}: does not start vasak-session")
          # copytoram removes /run/archiso/bootmnt, so the guard must be the
          # parent directory.
          if "/run/archiso" not in text:
              raise SystemExit(f"{profile}: missing live-medium guard")
          if "/run/archiso/bootmnt" in text:
              raise SystemExit(
                  f"{profile}: guard must not depend on bootmnt (copytoram)")
          if "exec vasak-session" in text:
              raise SystemExit(f"{profile}: must not exec, the shell is the fallback")

          if not session.stat().st_mode & stat.S_IXUSR:
              raise SystemExit(f"{session}: not executable")
          print("live autologin + desktop autostart OK")
          PY

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      - name: Build ISO in Arch container
        run: |
          set -euo pipefail
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PROFILE="$PROFILE" \
            -e VASAK_REPO_DIR="$VASAK_REPO_DIR" \
            archlinux:latest bash -lc '
              set -euo pipefail

              echo "== Refreshing pacman keyring =="
              pacman -Syu --noconfirm --needed archlinux-keyring gnupg
              pacman-key --init
              pacman-key --populate archlinux

              echo "== Installing build tools =="
              pacman -S --noconfirm --needed \
                archiso base-devel git rsync sudo gawk namcap \
                librsvg python-gobject gtk4 gtk4-layer-shell

              echo "== GTK4 / layer-shell API smoke test =="
              python - <<"PY"
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Gtk4LayerShell", "1.0")
          from gi.repository import Gtk, Gtk4LayerShell
          assert hasattr(Gtk, "init"), "Gtk.init missing"
          assert hasattr(Gtk4LayerShell, "set_keyboard_mode"), "gtk4-layer-shell too old"
          print("GTK4 + gtk4-layer-shell keyboard API OK")
          PY

              echo "== vasak-shell import smoke test =="
              PYTHONPATH=/work/packages/desktop/vasak-shell/app python - <<"PY"
          import main, ipc
          assert main.main(["--version"]) == 0
          assert callable(ipc.send_command)
          print("vasak-shell modules import OK")
          PY

              echo "== vasak-shell offline unit tests =="
              python /work/tests/test_shell_offline.py \
                /work/packages/desktop/vasak-shell/app

              echo "== Preparing build user =="
              id builder &>/dev/null || useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              WORK_UID="$(stat -c %u /work)"
              WORK_GID="$(stat -c %g /work)"
              chown -R builder:builder /work

              echo "== Cleaning test bytecode from source tree =="
              find /work -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
              find /work -name "*.pyc" -delete 2>/dev/null || true
              find /work -name "*.pyo" -delete 2>/dev/null || true

              echo "== Building [vasak] package repo =="
              su -s /bin/bash builder -c \
                "sudo env VASAK_REPO_DIR=\"$VASAK_REPO_DIR\" ./build-repo.sh"

              echo "== Building ISO: $PROFILE =="
              ./build-iso.sh "$PROFILE"

              echo "== Verifying live root filesystem =="
              ISO=$(ls iso-profiles/*/out/*.iso | head -1)
              WORKDIR=$(mktemp -d)
              bsdtar -xf "$ISO" -C "$WORKDIR" '*/x86_64/airootfs.sfs'
              SFS=$(find "$WORKDIR" -name "airootfs.sfs" | head -1)
              if [ -z "$SFS" ] || [ ! -f "$SFS" ]; then
                  echo "FAIL: airootfs.sfs not found in ISO"
                  exit 1
              fi
              bash /work/scripts/check-rootfs.sh "$SFS"

              # Files created by root inside the container must be readable by
              # the GitHub Actions runner user so the artifact upload works.
              chown -R "$WORK_UID:$WORK_GID" /work
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: vasak-iso-${{ github.event.inputs.profile || 'vasak' }}
          path: iso-profiles/*/out/*.iso
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          echo "### Vaşak Linux ISO build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh iso-profiles/*/out/*.iso >> "$GITHUB_STEP_SUMMARY" || true
