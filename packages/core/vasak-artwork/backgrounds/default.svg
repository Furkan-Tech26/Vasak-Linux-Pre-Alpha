<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Vaşak Linux Default Wallpaper - 1920x1080 -->
  <!-- Replace with actual artwork later -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E2E;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#282A36;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1E1E2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#181825;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#1E1E2E;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- Subtle glow center -->
  <ellipse cx="960" cy="540" rx="600" ry="300" fill="url(#glow)"/>

  <!-- Geometric accent lines (subtle) -->
  <g stroke="#88C0D0" stroke-width="1" stroke-opacity="0.1">
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
  </g>

  <!-- Badger logo (centered, large, subtle) -->
  <g transform="translate(960, 400) scale(2.5)">
    <g fill="#88C0D0" fill-opacity="0.08">
      <ellipse cx="100" cy="120" rx="35" ry="25"/>
      <ellipse cx="145" cy="100" rx="20" ry="18"/>
      <ellipse cx="162" cy="100" rx="12" ry="8"/>
      <path d="M135,80 Q140,60 150,80" fill="none" stroke="#88C0D0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.15"/>
      <circle cx="150" cy="97" r="3" fill="#88C0D0" fill-opacity="0.2"/>
      <path d="M130,95 Q145,85 160,95" fill="none" stroke="#ECEFF4" stroke-width="5" stroke-linecap="round" stroke-opacity="0.15"/>
      <path d="M130,105 Q145,115 160,105" fill="none" stroke="#ECEFF4" stroke-width="5" stroke-linecap="round" stroke-opacity="0.15"/>
      <rect x="75" y="135" width="6" height="25" rx="3"/>
      <rect x="90" y="135" width="6" height="25" rx="3"/>
      <rect x="125" y="135" width="6" height="25" rx="3"/>
      <rect x="140" y="135" width="6" height="25" rx="3"/>
      <path d="M65,125 Q50,115 45,130" fill="none" stroke="#88C0D0" stroke-width="8" stroke-linecap="round" stroke-opacity="0.15"/>
    </g>
  </g>

  <!-- Distro name -->
  <text x="960" y="780" font-family="sans-serif" font-size="48" font-weight="300" fill="#88C0D0" fill-opacity="0.4" text-anchor="middle" letter-spacing="4">VAŞAK LINUX</text>

  <!-- Tagline -->
  <text x="960" y="840" font-family="sans-serif" font-size="18" fill="#4C566A" text-anchor="middle">Badger doesn't care. Badger installs.</text>

  <!-- Version corner -->
  <text x="1880" y="1060" font-family="monospace" font-size="14" fill="#3B4252" text-anchor="end">vasak-2025.01</text>
</svg>