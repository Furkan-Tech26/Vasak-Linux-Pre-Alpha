<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Spinner for Plymouth theme - 12 segments -->
  <defs>
    <linearGradient id="spinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81A1C1;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <g fill="url(#spinGrad)">
    <!-- 12 segments, will be animated by script -->
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(0 32 32)"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(30 32 32)" opacity="0.92"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(60 32 32)" opacity="0.83"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(90 32 32)" opacity="0.75"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(120 32 32)" opacity="0.67"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(150 32 32)" opacity="0.58"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(180 32 32)" opacity="0.5"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(210 32 32)" opacity="0.42"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(240 32 32)" opacity="0.33"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(270 32 32)" opacity="0.25"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(300 32 32)" opacity="0.17"/>
    <rect x="30" y="2" width="4" height="18" rx="2" transform="rotate(330 32 32)" opacity="0.08"/>
  </g>
</svg>