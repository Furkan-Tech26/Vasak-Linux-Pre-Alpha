<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <!-- Vaşak GRUB Menu Border - 9-slice for GRUB -->
  <!-- This defines the border pieces for the menu box -->
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#81A1C1;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#88C0D0;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- GRUB expects 9 slices: corners, edges, center -->
  <!-- Top-left corner -->
  <rect x="0" y="0" width="20" height="20" rx="10" ry="10" fill="url(#borderGrad)"/>
  <!-- Top edge -->
  <rect x="20" y="0" width="760" height="20" fill="url(#borderGrad)"/>
  <!-- Top-right corner -->
  <rect x="780" y="0" width="20" height="20" rx="10" ry="10" fill="url(#borderGrad)"/>
  <!-- Right edge -->
  <rect x="780" y="20" width="20" height="440" fill="url(#borderGrad)"/>
  <!-- Bottom-right corner -->
  <rect x="780" y="460" width="20" height="20" rx="10" ry="10" fill="url(#borderGrad)"/>
  <!-- Bottom edge -->
  <rect x="20" y="460" width="760" height="20" fill="url(#borderGrad)"/>
  <!-- Bottom-left corner -->
  <rect x="0" y="460" width="20" height="20" rx="10" ry="10" fill="url(#borderGrad)"/>
  <!-- Left edge -->
  <rect x="0" y="20" width="20" height="440" fill="url(#borderGrad)"/>
  <!-- Center (transparent) -->
  <rect x="20" y="20" width="760" height="440" fill="none"/>
</svg>