<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <!-- Vaşak GRUB Menu Background - Glassmorphism card -->
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E3440;stop-opacity:0.85" />
      <stop offset="50%" style="stop-color:#3B4252;stop-opacity:0.80" />
      <stop offset="100%" style="stop-color:#4C566A;stop-opacity:0.75" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Glassmorphism card -->
  <rect x="10" y="10" width="780" height="460" rx="16" ry="16" fill="url(#glassGrad)" filter="url(#blur)"/>

  <!-- Subtle border highlight -->
  <rect x="10" y="10" width="780" height="460" rx="16" ry="16" fill="none" stroke="#88C0D0" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Inner glow top -->
  <rect x="14" y="14" width="772" height="60" rx="12" ry="12" fill="#88C0D0" fill-opacity="0.05"/>
</svg>