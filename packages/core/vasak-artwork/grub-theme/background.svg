<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Vaşak Linux GRUB Background - Glassmorphism -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E2E;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#282A36;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1E1E2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#181825;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="35%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#1E1E2E;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="30%">
      <stop offset="0%" style="stop-color:#81A1C1;stop-opacity:0.10" />
      <stop offset="100%" style="stop-color:#1E1E2E;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#1E1E2E;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <ellipse cx="384" cy="216" rx="600" ry="350" fill="url(#glow1)"/>
  <ellipse cx="1536" cy="864" rx="500" ry="300" fill="url(#glow2)"/>
  <ellipse cx="960" cy="432" rx="700" ry="400" fill="url(#centerGlow)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#88C0D0" stroke-width="0.5" stroke-opacity="0.02">
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
  </g>

  <!-- Badger logo watermark (center, subtle) -->
  <g transform="translate(960, 540) scale(3)" fill="#88C0D0" fill-opacity="0.04">
    <ellipse cx="0" cy="0" rx="35" ry="25"/>
    <ellipse cx="45" cy="-20" rx="20" ry="18"/>
    <ellipse cx="57" cy="-20" rx="12" ry="8"/>
    <circle cx="48" cy="-23" r="2" fill="#1E1E2E"/>
    <path d="M35,-30 Q38,-42 48,-30" fill="none" stroke="#88C0D0" stroke-width="2" stroke-linecap="round"/>
    <path d="M32,-5 Q40,-10 50,-5" fill="none" stroke="#ECEFF4" stroke-width="3" stroke-linecap="round"/>
    <path d="M32,5 Q40,10 50,5" fill="none" stroke="#ECEFF4" stroke-width="3" stroke-linecap="round"/>
    <rect x="-22" y="20" width="5" height="18" rx="2"/>
    <rect x="-10" y="20" width="5" height="18" rx="2"/>
    <rect x="20" y="20" width="5" height="18" rx="2"/>
    <rect x="32" y="20" width="5" height="18" rx="2"/>
    <path d="M-30,10 Q-42,5 -47,12" fill="none" stroke="#88C0D0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Distro name bottom -->
  <text x="1880" y="1060" font-family="sans-serif" font-size="14" fill="#3B4252" text-anchor="end">VAŞAK LINUX 2025.01</text>
</svg>