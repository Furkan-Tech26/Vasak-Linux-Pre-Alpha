    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4C566A;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#88C0D0;stop-opacity:0.6" />
