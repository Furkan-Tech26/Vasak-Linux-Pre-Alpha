      variant: ""
      label: "English (US)"
    - layout: "de"
      variant: ""
      label: "German"
    - layout: "fr"
      variant: ""
      label: "French"
    - layout: "es"
      variant: ""
      label: "Spanish"
    - layout: "it"
      variant: ""
      label: "Italian"
    - layout: "pt"
      variant: ""
      label: "Portuguese"
    - layout: "ru"
      variant: ""
      label: "Russian"