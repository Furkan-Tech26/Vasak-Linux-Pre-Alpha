# Vaşak Linux - Package Module Configuration
# Lets users choose Desktop Environment
module: "package@calamares"
name: "Desktop Environment"
loaded: true

# Package choices - user picks ONE
packageChoices:
    - label: "Minimal (TTY only) - No GUI, pure CLI"
      description: "Lightweight, server/embedded, install your own WM later"
      packages:
          - "base"
          - "linux"
          - "linux-firmware"
          - "systemd"
          - "networkmanager"
          - "openssh"
          - "sudo"
          - "vim"
          - "git"
          - "vasak-keyring"
          - "vasak-mirrorlist"
          - "vasak-installer"
          - "vasak-artwork"
      required: true

    - label: "XFCE Desktop - Lightweight GTK, traditional"
      description: "Classic desktop, low resource usage, highly customizable"
      packages:
          - "base"
          - "linux"
          - "linux-firmware"
          - "systemd"
          - "networkmanager"
          - "openssh"
          - "sudo"
          - "vim"
          - "git"
          - "xfce4"
          - "xfce4-goodies"
          - "xfce4-terminal"
          - "thunar"
          - "thunar-volman"
          - "thunar-archive-plugin"
          - "mousepad"
          - "ristretto"
          - "lightdm"
          - "lightdm-gtk-greeter"
          - "lightdm-gtk-greeter-settings"
          - "network-manager-applet"
          - "pulseaudio"
          - "pulseaudio-alsa"
          - "pavucontrol"
          - "bluez"
          - "bluez-utils"
          - "blueman"
          - "cups"
          - "cups-pdf"
          - "system-config-printer"
          - "noto-fonts"
          - "noto-fonts-emoji"
          - "noto-fonts-cjk"
          - "ttf-liberation"
          - "ttf-dejavu"
          - "adw-gtk-theme"
          - "papirus-icon-theme"
          - "vasak-keyring"
          - "vasak-mirrorlist"
          - "vasak-installer"
          - "vasak-desktop-settings"
          - "vasak-artwork"
      required: true

    - label: "Custom DE (Coming Soon) - Glassmorphism, Win8.1 style"
      description: "Vaşak's own desktop - glassmorphism, optimized, all-rounder (WIP)"
      packages:
          - "base"
          - "linux"
          - "linux-firmware"
          - "systemd"
          - "networkmanager"
          - "openssh"
          - "sudo"
          - "vim"
          - "git"
          - "vasak-keyring"
          - "vasak-mirrorlist"
          - "vasak-installer"
          - "vasak-artwork"
      required: false
      visible: false  # Hide until ready

# Show package descriptions
showDescriptions: true

# Allow manual package selection (advanced)
manualPackages: false