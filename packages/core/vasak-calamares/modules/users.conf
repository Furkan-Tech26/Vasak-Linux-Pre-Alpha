# Vaşak Linux - Users Module Configuration
module: "users@calamares"
name: "User Account"
loaded: true

# Default groups for new user
defaultGroups:
    - "wheel"
    - "network"
    - "video"
    - "audio"
    - "storage"
    - "users"
    - "lp"
    - "scanner"
    - "power"

# Autologin
autologinGroup: "autologin"
doAutologin: false

# Sudo
sudoersGroup: "wheel"
sudoersEntry: "%wheel ALL=(ALL:ALL) ALL"

# Hostname
defaultHostname: "vasak"

# Root password
rootPassword: ""
# If empty, root account is locked

# User password strength
minPasswordLength: 8
checkPasswordStrength: true

# Shell
defaultShell: "/bin/bash"

# Avatar
useAvatar: true
avatarPath: "/usr/share/pixmaps/vasak-logo.svg"