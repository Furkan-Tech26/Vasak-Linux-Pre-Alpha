# Vaşak Linux - Welcome Module Configuration
module: "welcome@calamares"
name: "Welcome"
loaded: true

# Welcome screen labels
welcomeLabel: |
  <h1>Welcome to Vaşak Linux</h1>
  <p>This installer will guide you through installing Vaşak Linux on your computer.</p>
  <p><b>Vaşak Linux</b> is an independent Turkish distribution built on pacman, using Arch repositories and AUR.</p>
  <ul>
    <li>🇹🇷 Turkey-first mirrors for fast downloads</li>
    <li>📦 60,000+ packages via Arch + AUR</li>
    <li>⚡ Optimized, fast, lightweight</li>
    <li>🎨 XFCE desktop + Custom Glassmorphism DE (coming)</li>
    <li>🔐 Full disk encryption support</li>
  </ul>

