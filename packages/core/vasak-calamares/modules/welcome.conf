# Show release notes
showReleaseNotes: true
releaseNotes: |
  <h2>Vaşak Linux 2025.01</h2>
  <p>First public release.</p>
  <ul>
    <li>Base system with systemd, NetworkManager</li>
    <li>Text installer (<tt>vasak-install</tt>) and graphical installer (Calamares)</li>
    <li>XFCE desktop environment</li>
    <li>AUR support via yay</li>
    <li>Turkey-optimized mirrorlist</li>
  </ul>