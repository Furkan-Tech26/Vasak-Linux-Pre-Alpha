# Vaşak Linux - Plymouth Module Configuration
# Boot splash/animation (optional, user chooses)
module: "plymouth@calamares"
name: "Boot Animation (Plymouth)"
loaded: true

# Theme to use
theme: "vasak"

# Show in GUI
showThemeSelector: true

# Available themes (installed by vasak-artwork + plymouth-themes)
# vasak - custom Vaşak glassmorphism theme
# spinner - simple spinner
# bgrt - BGRT-based (UEFI firmware logo)
# text - text mode
# details - detailed boot messages
# script - custom script