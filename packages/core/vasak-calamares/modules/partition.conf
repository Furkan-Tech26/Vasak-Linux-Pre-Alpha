# Vaşak Linux - Partition Module Configuration
module: "partition@calamares"
name: "Disk Setup"
loaded: true

# Show advanced options
showAdvanced: true

# Default filesystem
defaultFileSystem: "ext4"

# Available filesystems
fileSystems:
    - "ext4"
    - "btrfs"
    - "f2fs"
    - "xfs"

# Encryption
luksBootKeyFile: false
luksCipher: "aes-xts-plain64"
luksKeySize: 512
luksHash: "sha256"

# Partitioning modes
modes:
    - "install"
    - "replace"
    - "manual"

# Default mode
defaultMode: "install"

# Minimum disk size (MB)
minDiskSize: 8192

# Swap
swapSize: 4096
swapFile: false

# ESP partition
espSize: 512

# Root partition label
rootLabel: "VASAK_ROOT"

# Mount options
mountOptions: "rw,relatime"

# Show partition labels
showLabels: true