# Vaşak Linux - Services Module Configuration
module: "services@calamares"
name: "System Services"
loaded: true

# Services to enable by default
services:
    - "NetworkManager"
    - "systemd-timesyncd"
    - "systemd-resolved"
    - "systemd-logind"
    - "cronie"
    - "avahi-daemon"
    - "bluetooth"

# Desktop-specific services
desktopServices:
    xfce:
        - "lightdm"
        - "upower"
        - "udisks2"
        - "colord"
    custom:
        - "lightdm"  # or custom display manager
        - "upower"
        - "udisks2"
        - "colord"

# Services to disable (bloat removal)
disabledServices:
    - "systemd-rfkill"
    - "systemd-vconsole-setup"