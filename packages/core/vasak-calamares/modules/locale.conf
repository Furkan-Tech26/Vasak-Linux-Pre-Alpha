# Vaşak Linux - Locale Module Configuration
module: "locale@calamares"
name: "Language"
loaded: true

# Default locale
defaultLocale: "en_US.UTF-8"

# Show detailed locale list
detailedLocale: true

# GeoIP detection (requires internet)
geoip: true

# Timezone detection
timezoneGeoip: true

# Available locales (subset for faster loading)
locales:
    - "en_US.UTF-8"
    - "tr_TR.UTF-8"
    - "de_DE.UTF-8"
    - "fr_FR.UTF-8"
    - "es_ES.UTF-8"
    - "it_IT.UTF-8"
    - "pt_BR.UTF-8"
    - "ru_RU.UTF-8"
    - "zh_CN.UTF-8"
    - "ja_JP.UTF-8"
    - "ko_KR.UTF-8"