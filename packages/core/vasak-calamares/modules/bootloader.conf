# Vaşak Linux - Bootloader Module Configuration (GRUB2)
# Uses GRUB for both UEFI and BIOS, with glassmorphism theme
module: "bootloader@calamares"
name: "Bootloader"
loaded: true

# Use GRUB2 (supports UEFI + BIOS, has our glassmorphism theme)
bootloader: "grub2"

# EFI settings
efiBootloaderId: "Vaşak Linux"

# Kernel parameters
kernelOptions: "rw quiet loglevel=3"

# GRUB settings with glassmorphism theme
grubTheme: "/boot/grub/themes/vasak/theme.txt"
grubTimeout: 3
grubDefaultEntry: 0

# Show advanced options
showAdvanced: true

# os-prober for dual boot
osProber: true

# Install GRUB for both UEFI and BIOS
# (Calamares will detect firmware type automatically)
efiDirectory: "/boot"