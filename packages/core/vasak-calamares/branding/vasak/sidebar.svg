      <stop offset="0%" style="stop-color:#282A36;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E1E2E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="280" height="650" fill="url(#sidebarGrad)"/>

