    <path d="M35,-30 Q38,-42 48,-30" fill="none" stroke="#88C0D0" stroke-width="2" stroke-linecap="round"/>
    <path d="M32,-5 Q40,-10 50,-5" fill="none" stroke="#ECEFF4" stroke-width="3" stroke-linecap="round"/>
    <path d="M32,5 Q40,10 50,5" fill="none" stroke="#ECEFF4" stroke-width="3" stroke-linecap="round"/>
    <rect x="-22" y="20" width="5" height="18" rx="2"/>
