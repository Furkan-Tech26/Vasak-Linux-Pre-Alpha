<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <!-- Vaşak Linux Calamares Welcome Screen -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E2E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#282A36;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#181825;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#1E1E2E;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="900" height="650" fill="url(#bgGrad)"/>
  <ellipse cx="450" cy="260" rx="400" ry="180" fill="url(#centerGlow)"/>

  <!-- Badge -->
  <g transform="translate(450, 180) scale(2)">
    <circle cx="0" cy="0" r="60" fill="#282A36" stroke="#88C0D0" stroke-width="2"/>
    <g fill="#88C0D0">
      <ellipse cx="0" cy="15" rx="21" ry="15"/>
      <ellipse cx="27" cy="-5" rx="12" ry="11"/>
      <ellipse cx="37" cy="-5" rx="7" ry="5"/>
      <circle cx="30" cy="-8" r="2" fill="#1E1E2E"/>
      <path d="M21,-12 Q22,-21 30,-12" fill="none" stroke="#88C0D0" stroke-width="2" stroke-linecap="round"/>
      <path d="M19,0 Q22,-5 33,0" fill="none" stroke="#ECEFF4" stroke-width="3" stroke-linecap="round"/>
      <path d="M19,10 Q22,15 33,10" fill="none" stroke="#ECEFF4" stroke-width="3" stroke-linecap="round"/>
      <rect x="-12" y="21" width="4" height="15" rx="2"/>
      <rect x="-5" y="21" width="4" height="15" rx="2"/>
      <rect x="15" y="21" width="4" height="15" rx="2"/>
      <rect x="22" y="21" width="4" height="15" rx="2"/>
      <path d="M-17,15 Q-24,12 -27,17" fill="none" stroke="#88C0D0" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title -->
  <text x="450" y="360" font-family="Noto Sans, sans-serif" font-size="48" font-weight="300" fill="#ECEFF4" text-anchor="middle" letter-spacing="4">VAŞAK LINUX</text>

  <!-- Subtitle -->
  <text x="450" y="400" font-family="Noto Sans, sans-serif" font-size="20" fill="#88C0D0" text-anchor="middle" font-weight="400">Badger doesn't care. Badger installs.</text>

  <!-- Description -->
  <text x="450" y="460" font-family="Noto Sans, sans-serif" font-size="16" fill="#A3BE8C" text-anchor="middle">
    Independent Turkish distro • pacman + Arch repos + AUR • Glassmorphism DE coming
  </text>

  <!-- Features -->
  <g font-family="Noto Sans, sans-serif" font-size="14" fill="#D8DEE9" text-anchor="middle">
    <text x="450" y="520">🇹🇷 Turkey-first mirrors  •  📦 60,000+ packages  •  🎨 XFCE + Custom DE</text>
    <text x="450" y="550">⚡ Fast, optimized  •  🔐 LUKS encryption  •  🌐 Online &amp; offline install</text>
  </g>

  <!-- Version -->
  <text x="880" y="635" font-family="monospace" font-size="12" fill="#3B4252" text-anchor="end">vasak-2025.01</text>
</svg>