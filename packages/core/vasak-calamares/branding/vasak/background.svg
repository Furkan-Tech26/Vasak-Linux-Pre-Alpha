<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <!-- Vaşak Linux Calamares Background (main install window) -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E2E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#282A36;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#181825;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="35%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#1E1E2E;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="30%">
      <stop offset="0%" style="stop-color:#81A1C1;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#1E1E2E;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="900" height="650" fill="url(#bgGrad)"/>
  <ellipse cx="180" cy="130" rx="350" ry="200" fill="url(#glow)"/>
  <ellipse cx="720" cy="520" rx="300" ry="180" fill="url(#glow2)"/>

  <!-- Subtle geometric pattern -->
  <g stroke="#88C0D0" stroke-width="0.5" stroke-opacity="0.03">
    <line x1="0" y1="325" x2="900" y2="325"/>
    <line x1="450" y1="0" x2="450" y2="650"/>
  </g>

  <!-- Tiny badger watermark (bottom right) -->
  <g transform="translate(820, 580) scale(0.6)" fill="#88C0D0" fill-opacity="0.06">
    <ellipse cx="0" cy="0" rx="35" ry="25"/>
    <ellipse cx="45" cy="-20" rx="20" ry="18"/>
  </g>
</svg>