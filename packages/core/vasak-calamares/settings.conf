# Vaşak Linux Calamares Settings
# Main configuration file for Calamares installer

# Installer window title
windowTitle: "Vaşak Linux Installer"

# Branding
branding: "vasak"

# Module search paths
moduleSearchPath: "/usr/share/calamares/modules"
settingsSearchPath: "/etc/calamares"

# Modules to load (in order)
sequence:
    # Welcome & language selection
    - show:
        moduleName: "welcome"
    - show:
        moduleName: "locale"

    # Keyboard layout
    - show:
        moduleName: "keyboard"

    # Disk partitioning
    - show:
        moduleName: "partition"

    # User setup
    - show:
        moduleName: "users"

    # Package selection (DE choice)
    - show:
        moduleName: "package"

    # Bootloader choice (custom module: systemd-boot / GRUB / both + plymouth)
    - show:
        moduleName: "bootloader-choice"

    # Bootloader (GRUB with glassmorphism theme)
    - show:
        moduleName: "bootloader"

    # Plymouth boot animation
    - show:
        moduleName: "plymouth"

    # Services
    - show:
        moduleName: "services"

    # Summary & install
    - show:
        moduleName: "summary"
    - show:
        moduleName: "install"
    - show:
        moduleName: "finished"

# Global settings
debug: false
logfile: "/var/log/calamares.log"
loadModules: true