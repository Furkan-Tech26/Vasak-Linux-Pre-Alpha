#
# /etc/pacman.conf
# Vaşak Linux - pacman configuration
# Uses Arch repos + AUR + tiny custom repo
#

[options]
Architecture = auto
Color
ParallelDownloads = 8
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# ============================================================
# OFFICIAL ARCH REPOS (primary source - 60,000+ packages)
# ============================================================

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# For Steam, Wine, 32-bit libs
[multilib]
Include = /etc/pacman.d/mirrorlist

# ============================================================
# VAŞAK CUSTOM REPO (branding, installer, configs, DE)
# Tiny - only packages we actually maintain
# build-iso.sh rewrites mirrorlist-core to point at the local repo
# ============================================================

[vasak]
SigLevel = Optional TrustAll
Include = /etc/pacman.d/mirrorlist-core