[Service]
# Live medium: log in as root on tty1 automatically (same approach as the
# official Arch ISO). This also guarantees a logind session exists, which
# wlroots' libseat needs before labwc can take over the DRM device.
ExecStart=
ExecStart=-/usr/bin/agetty --noreset --noclear --autologin root - ${TERM}
