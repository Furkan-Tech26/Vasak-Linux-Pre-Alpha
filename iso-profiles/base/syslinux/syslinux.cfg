DEFAULT arch
PROMPT 0
TIMEOUT 50
UI menu.c32

MENU TITLE Vaşak Linux

LABEL arch
    MENU LABEL Vaşak Linux Live (x86_64, BIOS)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=auto quiet loglevel=3
